# Cosmic Horror - Eventi cosmici del prototipo (prima lista)
# status: DRAFT | version: 0.4.0 | prepared_by: Cowork | owner: Matteo | last_reviewed: 2026-10-31
#
# Lista di partenza approvata da Matteo (CT-DES-054); valori provvisori.
# Formato provvisorio (YAML), come le carte (CT-DES-018). Tutti i valori sono provvisori (CT-DES-030).
#
# Come si usa (regole base §7, CT-DES-021, 035, 036, 010):
#   - Tre mazzetti, uno per fase: fase I (giri 1-3), fase II (giri 4-6), fase III (dal giro 7).
#   - Ogni mazzetto si mescola con il seme della partita (CT-DES-019). Un evento improvviso va nella fase II e uno nella fase III.
#   - Alla fine di ogni giro si risolve l'evento in cima al mazzetto della fase in corso e si mostra il TIPO del successivo.
#   - Gli eventi improvvisi mostrano «?» al posto del tipo (CT-DES-035).
#   - «Il piu' esposto»: il giocatore con esposizione piu' alta; in parita', entrambi (regole base §7).
#   - «Il territorio piu' instabile»: in parita', sorteggio con il seme della partita.
#   - Se un mazzetto finisce, si rimescola.
#
# V0.2 (2026-10-31, CT-DES-058): chiarita la durata di Ombre Lunghe. Approvati come lista di partenza (CT-DES-054).
#
# V0.4 (2026-10-31, CT-DES-062): citazioni aggiunte; E16 rinominato «L'Orrore di Dunwich» (citazione dal racconto). Effetti invariati.
# V0.3 (2026-10-31, CT-DES-060): nomi a tema Lovecraft e Grandi Antichi; effetti invariati.
#
# Tipi: territorio | giocatore | campo (tutti i territori) | carte

eventi:
  fase_I:
    - {id: E01, citazione: {testo: "Vide processioni di figure incappucciate dai contorni non umani.", fonte: "The Haunter of the Dark", originale: "He saw processions of robed, hooded figures whose outlines were not human"}, nome: "I Sogni si Diffondono", tipo: territorio, effetto: "Il territorio piu' instabile: instabilita' +1."}
    - {id: E02, citazione: {testo: "Ero lontano da casa, e l'incantesimo del mare d'oriente era su di me.", fonte: "The Festival", originale: "I was far from home, and the spell of the eastern sea was upon me."}, nome: "Nebbia dal Mare", tipo: territorio, effetto: "Sul territorio con piu' presenze, tutte le presenze hanno -1 forza fino alla fine del giro successivo a quello in cui si risolve l'evento."}
    - {id: E03, citazione: {testo: "Secoli, e persino millenni, sembravano impressi nella sua superficie verdastra di\
  \ pietra sconosciuta.", fonte: "The Call of Cthulhu", originale: "centuries and even thousands of years seemed recorded in its dim and greenish surface of unplaceable stone"}, nome: "Incubi Ciclopici", tipo: giocatore, effetto: "Il piu' esposto scarta 1 carta a caso dalla mano."}
    - {id: E04, citazione: {testo: "E contro i moli marci il mare batteva.", fonte: "The Festival", originale: "And against the rotting wharves the sea pounded"}, nome: "La Marea di Innsmouth", tipo: campo, effetto: "Ogni territorio con instabilita' 0 sale a 1."}
    - {id: E05, citazione: {testo: "Tutta Arkham aveva sentito parlare della grande roccia caduta dal cielo.", fonte: "The Colour out of Space", originale: "all Arkham had heard of the great rock that fell out of the sky"}, nome: "Il Meteorite", tipo: territorio, effetto: "La Landa Maledetta: instabilita' +1."}
