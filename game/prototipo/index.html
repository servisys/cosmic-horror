<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1015">
<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cosmic Horror">
<title>Cosmic Horror - prototipo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1015; overflow: hidden; font-family: system-ui, 'Segoe UI', Arial, sans-serif; color: #e8e6e0; }
  #gioco { position: fixed; inset: 0; }
  #gioco canvas { display: block; }
  #inizio { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d1015; z-index: 5; }
  #inizio .scatola { max-width: 640px; padding: 12px 20px; text-align: center; }
  #inizio h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .04em; }
  #inizio p { margin: 4px 0 10px; font-size: 14px; opacity: .8; }
  #inizio .fazioni { display: flex; gap: 14px; justify-content: center; margin: 8px 0; }
  #inizio button { font: inherit; font-size: 16px; padding: 10px 16px; border-radius: 8px; border: 2px solid #4a5568; background: #1b2230; color: #fff; cursor: pointer; min-width: 190px; }
  #inizio button.custodi { border-color: #4d86c2; background: #162a42; }
  #inizio button.risvegliati { border-color: #64a56f; background: #1f2f22; }
  #inizio button.aiuto { min-width: 0; font-size: 13px; padding: 6px 12px; border-color: #b89a4a; background: #2a2414; margin: 4px 0; }
  #inizio button.aiuto.attivo { background: #6b5818; }
  #nota-tutorial { display: block; font-size: 12px; color: #e0b44c; min-height: 14px; }
  #inizio label { font-size: 13px; opacity: .8; }
  #inizio input { font: inherit; width: 90px; padding: 4px 6px; background: #151a24; color: #fff; border: 1px solid #4a5568; border-radius: 4px; }
  #inizio small { display: block; opacity: .6; margin-top: 6px; font-size: 12px; }
  /* telefono in verticale: invito a ruotarlo, sopra tutto il gioco */
  #ruota { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0d1015; color: #e8e6e0; text-align: center; padding: 24px; }
  #ruota svg { width: 84px; height: 84px; animation: ruota 2.4s ease-in-out infinite; }
  #ruota b { font-size: 26px; letter-spacing: .04em; }
  #ruota span { font-size: 15px; opacity: .8; }
  @keyframes ruota { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #ruota svg { animation: none; transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #ruota { display: flex; } }
  /* avviso di nuova versione (service worker) */
  #nuova-versione { position: fixed; left: 50%; top: 44px; transform: translateX(-50%); z-index: 20; font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 22px; border: 2px solid #3a2606; background: linear-gradient(#ffe58a, #c98f1c); color: #1a1104; font-weight: 700; cursor: pointer; box-shadow: 0 0 14px rgba(255, 210, 90, .6); max-width: 92vw; }
  #nuova-versione:disabled { opacity: .7; }
  #gioco canvas { touch-action: none; }
  @media (max-height: 480px) { #inizio h1 { font-size: 20px; } #inizio p { margin: 2px 0 6px; font-size: 12px; } #inizio button { padding: 7px 12px; font-size: 14px; } }
</style>
</head>
<body>
<div id="gioco"></div>
<div id="ruota" role="alert"><svg viewBox="0 0 64 64" fill="none" stroke="#e6c46a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="6" width="24" height="44" rx="4"/><path d="M30 44h4"/><path d="M10 36a24 24 0 0 0 10 18M54 28a24 24 0 0 0-10-18"/></svg><b>Ruota il telefono</b><span>Cosmic Horror si gioca in orizzontale.</span></div>
<div id="inizio">
  <div class="scatola">
    <h1>COSMIC HORROR</h1>
    <p>Prototipo giocabile - una persona contro il computer. Scegli la fazione.</p>
    <div class="fazioni">
      <button class="custodi" data-fazione="custodi"><b>I Custodi</b><br><small>difendono e stabilizzano i territori</small></button>
      <button class="risvegliati" data-fazione="risvegliati"><b>I Risvegliati</b><br><small>corrompono i territori e cercano il potere cosmico</small></button>
    </div>
    <div><button id="come-si-gioca" type="button" class="aiuto">Come si gioca (tutorial)</button><span id="nota-tutorial"></span></div>
    <label>Seme della partita (facoltativo): <input id="seme" inputmode="numeric" placeholder="casuale"></label>
    <small>Stesso seme e stesse mosse danno la stessa partita.</small>
    <small id="versione"></small>
  </div>
</div>
<script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
