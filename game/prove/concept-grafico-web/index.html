<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Concept grafico - carta</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #ui { position: fixed; left: 0; right: 0; bottom: 10px; display: flex; gap: 10px; justify-content: center; z-index: 2; }
      #ui button { background: #3c2f6b; color: #efeaff; border: 1px solid #6b57b3; border-radius: 10px; padding: 10px 16px; font-size: 15px; }
      #nota { position: fixed; left: 12px; top: 12px; color: #8a86a8; font-size: 12px; z-index: 2; max-width: 40vw; }
    </style>
  </head>
  <body>
    <div id="nota">Concept grafico - illustrazione segnaposto. Trascina per inclinare.</div>
    <div id="ui"><button id="b-anim">Rigioca entrata</button><button id="b-foil">Lucido on/off</button><button id="b-tilt">Usa giroscopio</button></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
