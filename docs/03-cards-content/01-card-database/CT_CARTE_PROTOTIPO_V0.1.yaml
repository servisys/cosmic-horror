# Cosmic Horror - Carte del prototipo (prima lista)
# status: DRAFT | version: 0.1.0 | prepared_by: Cowork | owner: Matteo | last_reviewed: 2026-10-31
#
# PROPOSTA DI COWORK, DA RIVEDERE DA MATTEO (CT-DES-047).
# Formato provvisorio (YAML): il formato definitivo dei dati si decide nell'architettura tecnica (CT-DES-018).
# Tutti i nomi, i costi, le forze e gli effetti sono PROVVISORI e vanno tarati nei playtest (CT-DES-030).
#
# Campi:
#   id: codice unico | nome | tipo: presenza | azione
#   costo: energia | forza: solo per le presenze
#   potente: esposizione aggiunta quando la giochi (0 se non e' potente)
#   copie: quante copie nel mazzo da 40
#   effetto: testo dell'effetto ("" = nessuno)
#   versione_cosmica: la carta in cui si trasforma (CT-DES-026, CT-DES-032), se esiste
#
# Azioni base sempre disponibili (provvisorie, regole base §10):
#   Porre un Sigillo (Custodi): 3 energia; su un territorio che controlli con instabilita' 2 o meno; uno per territorio.
#   Completare un rito (Risvegliati): 3 energia; su un territorio con una tua presenza e instabilita' 3 o piu'; uno per territorio.
#   Ridurre l'esposizione (tutti): 2 energia, esposizione -1, una volta per turno.

