# Cosmic Horror - Carte del prototipo (prima lista)
# status: DRAFT | version: 0.7.0 | prepared_by: Cowork | owner: Matteo | last_reviewed: 2026-11-01
# supersedes: CT_CARTE_PROTOTIPO_V0.6.yaml
#
# PROPOSTA DI COWORK, DA RIVEDERE DA MATTEO (CT-DES-047).
# Formato provvisorio (YAML): il formato definitivo dei dati si decide nell'architettura tecnica (CT-DES-018).
# Tutti i nomi, i costi, le forze e gli effetti sono PROVVISORI e vanno tarati nei playtest (CT-DES-030).
#
# V0.7 (2026-11-01, CT-DES-069, CT-DES-071, CT-DES-073): i territori diventano 5. Nuovi T4 (Dunwich) e T5 (R'lyeh), ciascuno con la sua riserva da 3 copie: T4r Pietra Incisa e T5r Idolo di Cthulhu. Le carte dei mazzi e i primi 3 territori sono invariati.
# V0.6 (2026-11-01, CT-DES-068): nuovi effetti di Formula di Dho-Hna (RI15) e Studio del Necronomicon (CU14): spostano di 1 la soglia di instabilita' per le tappe del turno di chi le gioca. Il resto e' invariato.
# V0.5 (2026-10-31, CT-DES-064): stringhe su una riga sola (YAML 1.2 valido); id delle carte di riserva; Fattoria Barricata protetta da azioni che costano 4 o meno; durata del malus del Tenebroso; azioni base allineate.
# V0.4 (2026-10-31, CT-DES-062): aggiunte le citazioni. Meccaniche invariate.
# V0.3 (2026-10-31, CT-DES-060): nomi a tema Lovecraft e Grandi Antichi. Meccaniche, costi e valori invariati.
#
# Campi:
#   id: codice unico | nome | tipo: presenza | azione
#   costo: energia | forza: solo per le presenze
#   potente: esposizione aggiunta quando la giochi (0 se non e' potente)
#   copie: quante copie nel mazzo da 40
#   effetto: testo dell'effetto ("" = nessuno)
#   citazione: frase di Lovecraft in fondo alla carta: testo (traduzione di Cowork), fonte (racconto), originale (inglese) (CT-DES-062)
#   versione_cosmica: la carta in cui si trasforma (CT-DES-026, CT-DES-032), se esiste
#
# Azioni base sempre disponibili (provvisorie, regole base §10):
#   Porre un Sigillo (Custodi): 2 energia; su un territorio che controlli con instabilita' 3 o meno; uno per territorio (CT-DES-055).
#   Completare un rito (Risvegliati): 2 energia; su un territorio dove hai una presenza, almeno tanta forza quanto l'avversario e instabilita' 3 o piu'; uno per territorio (CT-DES-055).
#   Le prime due tappe si fanno sui territori esterni, la terza solo a R'lyeh (CT-DES-070).
#   Ridurre l'esposizione (tutti): 2 energia, esposizione -1, una volta per turno.
#   Pietre ritte (chi controlla Dunwich): 1 energia, una volta per turno, instabilita' di un altro territorio +1 o -1 (CT-DES-071).
#
# V0.2 (2026-10-31, CT-DES-055 e CT-DES-058): costi e condizioni delle azioni base; Profanazione con le condizioni del rito;
#   Frammento Stellare (ora Frammento del Meteorite) senza instabilita'; Biblioteca (ora Biblioteca della Miskatonic) con 1 carta pescata. Esorcismo (ora Esorcismo di Armitage) e Profanazione: tappe toglibili solo finche' non sono consolidate (CT-DES-056).

fazioni:
  - id: custodi
    nome: I Custodi della Miskatonic
    carte:
      - {id: CU01, citazione: {testo: "Solo ogni tanto una lanterna oscillava orribilmente per i vicoli tortuosi.", fonte: "The Festival", originale: "Only once in a while a lantern bobbed horribly through serpentine alleys"}, nome: "Vedetta di Kingsport", tipo: presenza, costo: 1, forza: 2, potente: 0, copie: 4, effetto: ""}
      - {id: CU02, citazione: {testo: "Oggi brucerei quel maledetto Necronomicon e tutto il resto, se fossi il bibliotecario\ della Miskatonic.", fonte: "The Thing on the Doorstep", originale: "Today I'd burn that damned _Necronomicon_ and all the rest if I were librarian at Miskatonic."}, nome: "Bibliotecario della Miskatonic", tipo: presenza, costo: 2, forza: 2, potente: 0, copie: 3, effetto: "Quando entra: instabilita' di questo territorio -1.",
         versione_cosmica: {citazione: {testo: "La cosa più misericordiosa del mondo, credo, è l'incapacità della mente umana di\ mettere in relazione tutto ciò che contiene.", fonte: "The Call of Cthulhu", originale: "The most merciful thing in the world, I think, is the inability of the human mind to correlate all its contents."}, nome: Bibliotecario Sussurrante, costo: 2, forza: 2, potente: 1, effetto: "Quando entra: instabilita' di questo territorio -1 e peschi 1 carta."}}
      - {id: CU03, citazione: {testo: "E sono tanto più riluttante perché il mio avvertimento potrebbe essere vano.", fonte: "At the Mountains of Madness", originale: "And I am the more reluctant because my warning may be in vain."}, nome: "Membro della Spedizione Pabodie", tipo: presenza, costo: 3, forza: 4, potente: 0, copie: 3, effetto: "",
         versione_cosmica: {citazione: {testo: "Montagne della follia, i cui versanti più lontani guardavano su un ultimo, maledetto\ abisso.", fonte: "At the Mountains of Madness", originale: "mountains of madness whose farther slopes looked out over some accursed ultimate abyss"}, nome: Sopravvissuto che ha Visto Troppo, costo: 3, forza: 6, potente: 0, effetto: "Quando entra: instabilita' di questo territorio +1."}}
      - {id: CU04, citazione: {testo: "Né si deve credere che l'uomo sia il più antico o l'ultimo dei padroni della terra.", fonte: "The Dunwich Horror", originale: "Nor is it to be thought [ran the text as Armitage mentally translated it] that man is either the oldest or the last of earth's masters"}, nome: "Henry Armitage", tipo: presenza, costo: 5, forza: 6, potente: 0, copie: 2, effetto: "Le tue altre presenze su questo territorio hanno +1 forza."}
      - {id: CU05, citazione: {testo: "La gente del posto ha una paura mortale dei succiacapre, che nelle notti calde si\ mettono a cantare.", fonte: "The Dunwich Horror", originale: "the natives are mortally afraid of the numerous whippoorwills which grow vocal on warm nights"}, nome: "Cerchio dei Vigilanti", tipo: presenza, costo: 2, forza: 1, potente: 0, copie: 2, effetto: "Finche' e' qui, l'instabilita' di questo territorio non puo' superare 3."}
      - {id: CU06, citazione: {testo: "Telefonò in preda al panico alla compagnia elettrica, chiedendo precauzioni disperate\ contro un'interruzione della corrente.", fonte: "The Haunter of the Dark", originale: "he telephoned the electric light company in a frantic vein and asked that desperate precautions against a lapse of power be taken"}, nome: "Lampada di Federal Hill", tipo: presenza, costo: 3, forza: 3, potente: 0, copie: 2, effetto: "Quando entra: peschi 1 carta.",
         versione_cosmica: {citazione: {testo: "Poiché le grandi finestre non erano mai illuminate, sapeva che doveva essere vuota.", fonte: "The Haunter of the Dark", originale: "Since the vast windows were never lighted, he knew that it must be vacant."}, nome: Lampada Spenta, costo: 3, forza: 3, potente: 1, effetto: "Quando entra: peschi 2 carte."}}
      - {id: CU07, citazione: {testo: "Armitage regolava lo spruzzatore che Rice teneva in mano: qualcosa stava per accadere.", fonte: "The Dunwich Horror", originale: "Armitage was adjusting the sprayer which Rice held, and that something must be about to happen"}, nome: "Professor Rice", tipo: presenza, costo: 4, forza: 3, potente: 0, copie: 2, effetto: "All'inizio del tuo turno: instabilita' di questo territorio -1."}
      - {id: CU08, citazione: {testo: "Grandi impronte rotonde, più larghe di una botte.", fonte: "The Dunwich Horror", originale: "great raound marks bigger raound than a hogshead"}, nome: "Fattoria Barricata", tipo: presenza, costo: 2, forza: 3, potente: 0, copie: 2, effetto: "Non puo' essere eliminata da azioni che costano 4 o meno."}
      - {id: CU09, citazione: {testo: "I Profondi non potevano essere distrutti, anche se la magia primordiale dei dimenticati\ Antichi poteva a volte trattenerli.", fonte: "The Shadow over Innsmouth", originale: "The Deep Ones could never be destroyed, even though the palaeogean magic of the forgotten Old Ones might sometimes check them."}, nome: "Pietra Stellata di Mnar", tipo: presenza, costo: 4, forza: 2, potente: 0, copie: 2, effetto: "Quando entra: se qui puoi porre un Sigillo, lo poni senza pagare energia."}
      - {id: CU10, citazione: {testo: "Lo scorcio di eoni proibiti che mi gela quando ci penso e mi fa impazzire quando\ lo sogno.", fonte: "The Call of Cthulhu", originale: "the single glimpse of forbidden eons which chills me when I think of it and maddens me when I dream of it"}, nome: "Sonno senza Sogni", tipo: azione, costo: 1, potente: 0, copie: 3, effetto: "Instabilita' di un territorio -1."}
      - {id: CU11, citazione: {testo: "Quando Randolph Carter aveva trent'anni, perse la chiave della porta dei sogni.", fonte: "The Silver Key", originale: "When Randolph Carter was thirty he lost the key to the gate of dreams."}, nome: "Lucidità", tipo: azione, costo: 1, potente: 0, copie: 2, effetto: "La tua esposizione -1."}
      - {id: CU12, citazione: {testo: "Si vide il gruppo raggiungere la piccola altura poco dopo che l'invisibile bestemmia\ vi era passata.", fonte: "The Dunwich Horror", originale: "the party were seen to gain the minor elevation only a short time after the invisible blasphemy had passed it"}, nome: "Rinforzi da Arkham", tipo: azione, costo: 2, potente: 0, copie: 3, effetto: "Una tua presenza ha +2 forza fino a fine partita."}
      - {id: CU13, citazione: {testo: "Guardò a lungo la sinistra pietra simile a un altare, sulla cima.", fonte: "The Dunwich Horror", originale: "he looked long at the sinister altarlike stone on the summit"}, nome: "Esorcismo di Armitage", tipo: azione, costo: 3, potente: 0, copie: 2, effetto: "Rimuovi un rito avversario non ancora consolidato da un territorio che controlli."}
      - {id: CU14, citazione: {testo: "La pagina di sinistra, nella versione latina, conteneva minacce mostruose alla pace\ e alla sanità del mondo.", fonte: "The Dunwich Horror", originale: "the left-hand one of which, in the Latin version, contained such monstrous threats to the peace and sanity of the world"}, nome: "Studio del Necronomicon", tipo: azione, costo: 1, potente: 0, copie: 2, effetto: "In questo turno puoi porre un Sigillo anche su un territorio con instabilità 4 (invece di 3 o meno)."}
      - {id: CU15, citazione: {testo: "È invisibile, lo sapevo; ma in questo spruzzatore c'è una polvere che potrebbe farlo\ apparire per un istante.", fonte: "The Dunwich Horror", originale: "It's invisible--I knew it would be--but there's a powder in this long-distance sprayer that might make it show up for a second."}, nome: "Polvere di Ibn Ghazi", tipo: azione, costo: 3, potente: 0, copie: 2, effetto: "Elimina una presenza avversaria con forza 3 o meno."}
      - {id: CU16, citazione: {testo: "Aldebaran sembrò restare un istante in equilibrio sulla guglia spettrale.", fonte: "The Festival", originale: "Aldebaran had seemed to balance itself a moment on the ghostly spire"}, nome: "Osservatorio della Miskatonic", tipo: azione, costo: 2, potente: 0, copie: 2, effetto: "Peschi 2 carte."}
      - {id: CU17, citazione: {testo: "Ma quando le stelle erano sbagliate, Essi non potevano vivere.", fonte: "The Call of Cthulhu", originale: "but when the stars were wrong, They could not live"}, nome: "Le Stelle Non Sono Giuste", tipo: azione, costo: 4, potente: 1, copie: 1, effetto: "Instabilita' di tutti i territori -2."}
      - {id: CU18, citazione: {testo: "Bruciava una sostanza così pungente che i fumi invasero tutta la casa.", fonte: "The Case of Charles Dexter Ward", originale: "burning some substance so pungent that its fumes escaped over the entire house"}, nome: "Fuoco Purificatore", tipo: azione, costo: 5, potente: 2, copie: 1, effetto: "Elimina tutte le presenze avversarie con forza 2 o meno su un territorio."}

  - id: risvegliati
    nome: I Risvegliati, culto dei Grandi Antichi
    carte:
      - {id: RI01, citazione: {testo: "La Sala colonnata dell'Ordine di Dagon, a New Church Green.", fonte: "The Shadow over Innsmouth", originale: "the pillared Order of Dagon Hall at New Church Green"}, nome: "Iniziato dell'Ordine di Dagon", tipo: presenza, costo: 1, forza: 1, potente: 0, copie: 4, effetto: "Quando entra: instabilita' di questo territorio +1.",
         versione_cosmica: {citazione: {testo: "Aveva la testa stretta, occhi sporgenti e acquosi che sembravano non battere mai\ le palpebre, il naso piatto.", fonte: "The Shadow over Innsmouth", originale: "He had a narrow head, bulging, watery blue eyes that seemed never to wink, a flat nose"}, nome: Iniziato Mutato, costo: 1, forza: 2, potente: 0, effetto: "Quando entra: instabilita' di questo territorio +2."}}
      - {id: RI02, citazione: {testo: "Ph'nglui mglw'nafh Cthulhu R'lyeh wgah'nagl fhtagn.", fonte: "The Call of Cthulhu", originale: "Ph'nglui mglw'nafh Cthulhu R'lyeh wgah'nagl fhtagn."}, nome: "Cultista delle Paludi", tipo: presenza, costo: 2, forza: 2, potente: 0, copie: 3, effetto: "+1 forza se l'instabilita' di questo territorio e' 3 o piu'.",
         versione_cosmica: {citazione: {testo: "Adoravano, così dicevano, i Grandi Antichi, vissuti ere prima degli uomini e venuti\ dal cielo sul mondo giovane.", fonte: "The Call of Cthulhu", originale: "They worshiped, so they said, the Great Old Ones who lived ages before there were any men, and who came to the young world out of the sky."}, nome: Cultista Trasfigurato, costo: 2, forza: 3, potente: 0, effetto: "+2 forza se l'instabilita' di questo territorio e' 3 o piu'."}}
      - {id: RI03, citazione: {testo: "Fin da bambino aveva attirato l'attenzione con le storie strane e i sogni bizzarri\ che era solito raccontare.", fonte: "The Call of Cthulhu", originale: "had from childhood excited attention through the strange stories and odd dreams he was in the habit of relating"}, nome: "Sognatore di R'lyeh", tipo: presenza, costo: 3, forza: 2, potente: 1, copie: 2, effetto: "Quando entra: peschi 1 carta.",
         versione_cosmica: {citazione: {testo: "La bellezza calma e duratura viene solo nel sogno.", fonte: "The Silver Key", originale: "Calm, lasting beauty comes only in dream"}, nome: Sognatore Perduto, costo: 3, forza: 2, potente: 1, effetto: "Quando entra: peschi 2 carte."}}
      - {id: RI04, citazione: {testo: "Le loro forme ricordavano vagamente l'uomo, ma le teste erano teste di pesce, con\ enormi occhi sporgenti che non si chiudevano mai.", fonte: "The Shadow over Innsmouth", originale: "Their forms vaguely suggested the anthropoid, while their heads were the heads of fish, with prodigious bulging eyes that never closed."}, nome: "Profondo di Innsmouth", tipo: presenza, costo: 3, forza: 4, potente: 0, copie: 3, effetto: "",
         versione_cosmica: {citazione: {testo: "Da ottantamila anni Pth'thya-l'yi viveva a Y'ha-nthlei.", fonte: "The Shadow over Innsmouth", originale: "For eighty thousand years Pth'thya-l'yi had lived in Y'ha-nthlei"}, nome: Profondo Antico, costo: 3, forza: 6, potente: 1, effetto: ""}}
      - {id: RI05, citazione: {testo: "Più case vuote che persone, credo, e nessun commercio, a parte la pesca e le aragoste.", fonte: "The Shadow over Innsmouth", originale: "More empty houses than there are people, I guess, and no business to speak of except fishing and lobstering."}, nome: "Pescatore di Innsmouth", tipo: presenza, costo: 2, forza: 1, potente: 0, copie: 2, effetto: "All'inizio del tuo turno: instabilita' di questo territorio +1."}
      - {id: RI06, citazione: {testo: "Lavinia riprese i suoi vagabondaggi per le colline, portando tra le braccia sproporzionate\ il bambino scuro.", fonte: "The Dunwich Horror", originale: "Lavinia resumed her customary rambles in the hills, bearing in her misproportioned arms the swarthy child"}, nome: "Lavinia Whateley", tipo: presenza, costo: 4, forza: 3, potente: 0, copie: 2, effetto: "I riti su questo territorio costano 1 energia in meno."}
      - {id: RI07, citazione: {testo: "Il campanile nero e minaccioso che gli uccelli evitavano.", fonte: "The Haunter of the Dark", originale: "the black, frowning steeple shunned by the birds"}, nome: "Il Tenebroso", tipo: presenza, costo: 2, forza: 2, potente: 0, copie: 2, effetto: "Quando entra: una presenza avversaria su questo territorio -1 forza fino a fine partita.",
         versione_cosmica: {citazione: {testo: "Ali nere… Yog-Sothoth salvami… l'occhio ardente a tre lobi.", fonte: "The Haunter of the Dark", originale: "black wings--Yog-Sothoth save me--the three-lobed burning eye"}, nome: Il Tenebroso Affamato, costo: 2, forza: 2, potente: 0, effetto: "Quando entra: una presenza avversaria su questo territorio -2 forza fino a fine partita."}}
      - {id: RI08, citazione: {testo: "Tekeli-li! Tekeli-li!", fonte: "At the Mountains of Madness", originale: "Tekeli-li! Tekeli-li!"}, nome: "Shoggoth", tipo: presenza, costo: 5, forza: 6, potente: 1, copie: 2, effetto: ""}
      - {id: RI09, citazione: {testo: "L'idolo scolpito era il grande Cthulhu.", fonte: "The Call of Cthulhu", originale: "The carven idol was great Cthulhu"}, nome: "Effigie di Cthulhu", tipo: presenza, costo: 1, forza: 0, potente: 0, copie: 2, effetto: "Conta come tua presenza per i riti, non per il controllo."}
      - {id: RI10, citazione: {testo: "Nella sua casa a R'lyeh il morto Cthulhu attende sognando.", fonte: "The Call of Cthulhu", originale: "In his house at R'lyeh dead Cthulhu waits dreaming."}, nome: "Sussurro dalla Cripta", tipo: azione, costo: 1, potente: 0, copie: 3, effetto: "Instabilita' di un territorio +1.",
         versione_cosmica: {citazione: {testo: "Un giorno avrebbe chiamato, quando le stelle fossero state pronte, e il culto segreto\ lo avrebbe atteso per liberarlo.", fonte: "The Call of Cthulhu", originale: "Some day he would call, when the stars were ready, and the secret cult would always be waiting to liberate him."}, nome: Urlo dalla Cripta, costo: 1, potente: 0, effetto: "Instabilita' di un territorio +2."}}
      - {id: RI11, citazione: {testo: "Dèi che portassero buona pesca in cambio dei sacrifici.", fonte: "The Shadow over Innsmouth", originale: "gods as ud bring 'em good fishin' in return fer their sacrifices"}, nome: "Patto con i Profondi", tipo: azione, costo: 0, potente: 1, copie: 2, effetto: "+2 energia in questo turno."}
      - {id: RI12, citazione: {testo: "A quelle cose piacevano i sacrifici umani.", fonte: "The Shadow over Innsmouth", originale: "Them things liked human sacrifices."}, nome: "Profanazione", tipo: azione, costo: 3, potente: 0, copie: 2, effetto: "Rimuovi un Sigillo avversario non ancora consolidato da un territorio con instabilita' 3 o piu', dove hai una presenza e almeno tanta forza quanto l'avversario."}
      - {id: RI13, citazione: {testo: "Ma il ricordo non morì mai, e i sommi sacerdoti dicevano che la città sarebbe risorta\ quando le stelle fossero state giuste.", fonte: "The Call of Cthulhu", originale: "But memory never died, and high priests said that the city would rise again when the stars were right."}, nome: "Sogni di R'lyeh", tipo: azione, costo: 2, potente: 1, copie: 2, effetto: "Peschi 2 carte."}
      - {id: RI14, citazione: {testo: "Quella mattina lo specchio mi disse senza dubbio che avevo preso l'aspetto di Innsmouth.", fonte: "The Shadow over Innsmouth", originale: "That morning the mirror definitely told me I had acquired _the Innsmouth look_."}, nome: "L'Aspetto di Innsmouth", tipo: azione, costo: 2, potente: 0, copie: 3, effetto: "Una presenza avversaria -2 forza fino a fine partita."}
      - {id: RI15, citazione: {testo: "Se non riuscirò a passare con la formula di Dho-Hna, quando l'avrò imparata.", fonte: "The Dunwich Horror", originale: "if I can't break through with the Dho-Hna formula when I commit it"}, nome: "Formula di Dho-Hna", tipo: azione, costo: 1, potente: 0, copie: 2, effetto: "In questo turno puoi completare un rito anche su un territorio con instabilità 2 (invece di 3 o più)."}
      - {id: RI16, citazione: {testo: "Yog-Sothoth è la chiave e il guardiano della porta.", fonte: "The Dunwich Horror", originale: "_Yog-Sothoth_ is the key and guardian of the gate."}, nome: "Benedizione di Yog-Sothoth", tipo: azione, costo: 3, potente: 1, copie: 2, effetto: "Una tua presenza ha +3 forza fino a fine partita."}
      - {id: RI17, citazione: {testo: "Apri le porte a Yog-Sothoth con il lungo canto.", fonte: "The Dunwich Horror", originale: "Open up the gates to Yog-Sothoth with the long chant"}, nome: "Yog-Sothoth Apre la Porta", tipo: azione, costo: 4, potente: 2, copie: 1, effetto: "Instabilita' di tutti i territori +1; elimina una presenza avversaria con forza 2 o meno."}
      - {id: RI18, citazione: {testo: "Y'ha-nthlei non fu distrutta quando gli uomini della terra di sopra scagliarono la\ morte nel mare.", fonte: "The Shadow over Innsmouth", originale: "Y'ha-nthlei was not destroyed when the upper-earth men shot death into the sea."}, nome: "Dagon Emerge", tipo: azione, costo: 6, potente: 2, copie: 1, effetto: "Elimina tutte le presenze con forza 3 o meno su un territorio, anche le tue."}

territori:
  - {id: T1, citazione: {testo: "Quello che i vecchi raccontano dello scoglio nero al largo: lo chiamano lo Scoglio\ del Diavolo.", fonte: "The Shadow over Innsmouth", originale: "what some of the old-timers tell about the black reef off the coast--Devil Reef, they call it"}, nome: Innsmouth e la Scogliera del Diavolo, effetto: "Chi lo controlla pesca 1 carta in piu' all'inizio del proprio turno.",
     riserva: [{id: T1r, citazione: {testo: "Quel vecchio canuto, Zadok Allen, aveva 96 anni, era un po' tocco ed era l'ubriacone\ del paese.", fonte: "The Shadow over Innsmouth", originale: "This hoary character, Zadok Allen, was 96 years old and somewhat touched in the head, besides being the town drunkard."}, nome: Diario di Zadok Allen, tipo: azione, costo: 1, potente: 0, copie: 3, effetto: "Peschi 1 carta e vedi il tipo dei prossimi 2 eventi cosmici."}]}
  - {id: T2, citazione: {testo: "In quel momento mi pentii di aver mai letto l'aborrito Necronomicon.", fonte: "At the Mountains of Madness", originale: "At the moment I felt sorry that I had ever read the abhorred _Necronomicon_"}, nome: La Biblioteca della Miskatonic, effetto: "Chi ne prende il controllo pesca 1 carta, poi guarda le prime 3 carte del proprio mazzo e le rimette nell'ordine che vuole.",
     riserva: [{id: T2r, citazione: {testo: "Gli Antichi furono, gli Antichi sono e gli Antichi saranno.", fonte: "The Dunwich Horror", originale: "The Old Ones were, the Old Ones are, and the Old Ones shall be."}, nome: Pagina del Necronomicon, tipo: azione, costo: 1, potente: 1, copie: 3, effetto: "Cerca nel tuo mazzo una carta azione e mettila in mano."}]}
  - {id: T3, citazione: {testo: "A ovest di Arkham le colline si innalzano selvagge, e ci sono valli con boschi profondi\ che nessuna scure ha mai tagliato.", fonte: "The Colour out of Space", originale: "West of Arkham the hills rise wild, and there are valleys with deep woods that no axe has ever cut."}, nome: La Landa Maledetta, effetto: "Ogni carta potente giocata qui fa salire l'instabilita' di questo territorio di 1 in piu'.",
     riserva: [{id: T3r, citazione: {testo: "Tutto cominciò, disse il vecchio Ammi, con il meteorite.", fonte: "The Colour out of Space", originale: "It all began, old Ammi said, with the meteorite."}, nome: Frammento del Meteorite, tipo: azione, costo: 0, potente: 0, copie: 3, effetto: "+1 energia in questo turno."}]}
